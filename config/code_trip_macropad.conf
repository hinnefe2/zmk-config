# Enable USB HID so the macropad works wired
CONFIG_ZMK_USB=y

# Allow re-pairing without manually clearing the bond on the keyboard side.
# Without this, after a host loses its bond record, Zephyr's smp_pairing_req
# rejects the new pair attempt with BT_SMP_ERR_AUTH_REQUIREMENTS via
# update_keys_check, because a Just-Works bond already exists for that peer.
# See: https://github.com/zephyrproject-rtos/zephyr/discussions/41907
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y

# ZMK_BLE_EXPERIMENTAL_SEC -> BT_SMP_ALLOW_UNAUTH_OVERWRITE -> implies
# ZMK_BLE_PASSKEY_ENTRY. Explicitly disable: this macropad has 5 keys
# (F13-F17) and physically cannot enter a 6-digit passkey.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
